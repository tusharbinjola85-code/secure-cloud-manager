<!DOCTYPE html>
<html>
<head>

<title>New Password</title>

<style>

body{
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

.box{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:400px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
}

</style>

</head>

<body>

<div class="box">

<h1>Set New Password</h1>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

Change Password

</button>

</form>

</div>

</body>
</html>
