<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:350px;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#10b981;
    color:white;
    border:none;
}

.error{
    color:red;
}

</style>

</head>

<body>

<div class="box">

<h1>Create Account</h1>

<p class="error">{{ error }}</p>

<form method="POST">

{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
