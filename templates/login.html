<!DOCTYPE html>
<html>
<head>

<title>Secure Cloud Manager</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#141e30,#243b55);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:350px;
    background:white;
    padding:40px;
    border-radius:15px;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#2563eb;
    color:white;
    border:none;
}

a{
    text-decoration:none;
}

.error{
    color:red;
}

</style>

</head>

<body>

<div class="box">

<h1>Secure Cloud Manager</h1>

<p class="error">{{ error }}</p>

<form method="POST">

{% csrf_token %}

<input type="text" name="username" placeholder="Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<br>

<a href="/register">Create Account</a>

</div>

</body>
</html>
