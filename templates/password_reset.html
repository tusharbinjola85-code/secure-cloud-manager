<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .reset-box{
            background:#1e293b;
            padding:40px;
            border-radius:20px;
            width:400px;
            color:white;
            text-align:center;
        }

        .reset-box h1{
            margin-bottom:15px;
        }

        .reset-box p{
            margin-bottom:25px;
            color:#cbd5e1;
        }

        .reset-box input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            margin-bottom:20px;
            background:#0f172a;
            color:white;
        }

        .reset-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#3b82f6;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        .reset-btn:hover{
            background:#2563eb;
        }

    </style>

</head>

<body>

<div class="reset-box">

    <h1>

        Forgot Password

    </h1>

    <p>

        Enter your email to receive password reset link

    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.email }}

        <button type="submit" class="reset-btn">

            Send Reset Link

        </button>

    </form>

</div>

</body>
</html>
