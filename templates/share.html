{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shared File</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .share-box{
            background:#1e293b;
            padding:40px;
            border-radius:20px;
            width:400px;
            text-align:center;
        }

        .share-box img{
            width:100%;
            border-radius:15px;
            margin-bottom:20px;
        }

        .pdf-icon,
        .file-icon{
            font-size:100px;
            margin-bottom:20px;
        }

        .pdf-icon{
            color:#ef4444;
        }

        .file-icon{
            color:#60a5fa;
        }

        .download-btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 25px;
            background:#3b82f6;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="share-box">

    {% if '.png' in shared_file.file.url or '.jpg' in shared_file.file.url or '.jpeg' in shared_file.file.url %}

        <img src="{{ shared_file.file.url }}">

    {% elif '.pdf' in shared_file.file.url %}

        <div class="pdf-icon">

            <i class="fa-solid fa-file-pdf"></i>

        </div>

    {% else %}

        <div class="file-icon">

            <i class="fa-solid fa-file"></i>

        </div>

    {% endif %}

    <h2>

        {{ shared_file.file.name }}

    </h2>

    <a href="{{ shared_file.file.url }}"
    class="download-btn"
    download>

        <i class="fa-solid fa-download"></i>

        Download File

    </a>

</div>

</body>
</html>
